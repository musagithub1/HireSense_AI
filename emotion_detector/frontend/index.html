<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireSense emotion detector</title>
  </head>
  <body>
    <main class="detector">
      <section class="camera-shell" aria-label="Camera preview">
        <video id="camera" autoplay muted playsinline></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <div id="camera-placeholder" class="camera-placeholder">
          <span class="spinner" aria-hidden="true"></span>
          <span>Starting camera</span>
        </div>
      </section>

      <section class="reading" aria-live="polite">
        <div class="reading-header">
          <div>
            <p class="eyebrow">Live facial signal</p>
            <h2 id="state-label">Initializing</h2>
          </div>
          <span id="model-badge" class="badge badge-loading">Loading model</span>
        </div>

        <div class="score-row">
          <span>Calm</span>
          <strong id="score-label">No reading</strong>
          <span>Stressed</span>
        </div>
        <div
          class="score-track"
          role="progressbar"
          aria-label="Estimated stress score"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="score-fill" class="score-fill"></div>
        </div>
        <p id="status-message" class="status-message">
          Loading the trained model and face detector.
        </p>
        <p class="disclaimer">
          Practice signal only. This is not a medical or hiring assessment.
        </p>
      </section>
    </main>

    <canvas id="face-crop" width="48" height="48" hidden></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
